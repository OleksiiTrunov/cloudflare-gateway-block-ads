name: Block ads update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - '**'

jobs:
  block_ads_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq, curl and other utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl coreutils

      - name: Run the script
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x block_ads.sh
          ./block_ads.sh
      - name: Run the script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x block_ads.sh
          ./block_ads.sh

      - name: Send Telegram notification on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚨
            Все поломалось!
            О нет!
            Cloudflare AdBlock не работает!
            Скрипт не смог обновить списки. 
            Посмотреть логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}    
